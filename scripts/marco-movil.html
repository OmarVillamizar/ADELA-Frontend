<!doctype html>
<!-- Celulares de ancho real para scripts/capturas.sh: la ruta va en el hash
     (marco-movil.html#/login). Si empieza por "file" se carga tal cual. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 10px; display: flex; gap: 14px; align-items: flex-start; background: #444; font: 12px sans-serif; color: #fff; }
  figure { margin: 0; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<script>
  var ruta = location.hash.slice(1) || '/login'
  var url = ruta.indexOf('file') === 0 ? ruta : 'http://localhost:3000' + ruta
  ;[[320, 568], [360, 640], [390, 844], [430, 932]].forEach(function (t) {
    var f = document.createElement('figure')
    f.innerHTML = t[0] + 'x' + t[1] +
      '<iframe width="' + t[0] + '" height="' + t[1] + '" src="' + url + '"></iframe>'
    document.body.appendChild(f)
  })
</script>
</body>
</html>
